steps:
  # Build production unified container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/agentic-rag:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/agentic-rag:latest'
      - '.'

  # Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/agentic-rag'

  # Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agentic-rag-service'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/agentic-rag:$COMMIT_SHA'
      - '--region'
      - '$_LOCATION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GOOGLE_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LLM_MODEL=gemini/gemini-3.1-flash-lite,EMBEDDING_MODEL=models/gemini-embedding-001,VECTOR_DB_TYPE=qdrant,QDRANT_COLLECTION_NAME=agentic_rag_documents,QDRANT_URL=https://7e28c9e6-5aa7-41b9-9a5e-49b50e5a650c.us-east4-0.gcp.cloud.qdrant.io,RETRIEVAL_TOP_K=5,USE_HYBRID_SEARCH=true,LANGSMITH_TRACING=true,LANGSMITH_ENDPOINT=https://api.smith.langchain.com,LANGSMITH_PROJECT=Agentic_RAG'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/agentic-rag:$COMMIT_SHA'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/agentic-rag:latest'

substitutions:
  _LOCATION: us-central1
  _REPOSITORY: agentic-rag-repo

options:
  logging: CLOUD_LOGGING_ONLY
