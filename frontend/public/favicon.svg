<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ragGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Rounded Tile Background -->
  <rect width="64" height="64" rx="16" fill="#0A0A0C" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#272730" stroke-width="1.5" />
  
  <!-- Outer Glow Aura -->
  <path d="M32 10 L38 26 L54 32 L38 38 L32 54 L26 38 L10 32 L26 26 Z" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.6" />
  
  <!-- Core Agent Star / Sparkle Shape -->
  <path d="M32 12 L37.5 26.5 L52 32 L37.5 37.5 L32 52 L26.5 37.5 L12 32 L26.5 26.5 Z" fill="url(#ragGradient)" />
  
  <!-- High-Energy Center Fusion Core -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Orbital Retrieval Source Nodes (Doc, Web, Wiki) -->
  <circle cx="48" cy="18" r="2.5" fill="#FBBF24" opacity="0.9" />
  <circle cx="16" cy="46" r="2.5" fill="#A78BFA" opacity="0.9" />
  <circle cx="47" cy="47" r="2" fill="#F472B6" opacity="0.8" />
</svg>